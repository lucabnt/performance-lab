name: Android build candidate
on:
  workflow_dispatch:
    inputs:
      wheel_artifact_run:
        description: Run ID with the reviewed android-native-wheels artifact (both ABIs and SHA256.json)
        required: true
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-native-wheels
          path: android/wheels
          run-id: ${{ inputs.wheel_artifact_run }}
          github-token: ${{ github.token }}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python scripts/verify_suite_ui.py
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python scripts/build_android.py --check
      - run: python scripts/build_android.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Fuorigiri-android-debug-candidate
          path: dist/release/*.apk
          if-no-files-found: error
