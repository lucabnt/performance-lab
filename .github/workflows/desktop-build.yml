name: Desktop build candidates
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # RT-19: PyPI pins with hashes, then the vendored common wheel (digest checked by verify_core.py).
      - run: python -m pip install --require-hashes -r requirements-lock-windows.hashes
      - run: python -m pip install --no-deps --no-index -r requirements-common.txt
      - run: python scripts/verify_suite_ui.py
      - run: python scripts/verify_core.py
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm run test:signals
        working-directory: frontend
      - run: python -m pytest -q
      # WIN-AV-02: bootloader compiled on the runner (MSVC), never the prebuilt public one.
      - run: python scripts/build_pyinstaller_bootloader.py --output ci-bootloader --install
      - run: python scripts/build.py --bootloader-record ci-bootloader/PROVENIENZA.json
      - shell: pwsh
        run: |
          $smoke = Start-Process -FilePath dist/Fuorigiri/Fuorigiri.exe -ArgumentList '--smoke-test','--data','.local/ci-smoke' -WindowStyle Hidden -PassThru -Wait
          if ($smoke.ExitCode -ne 0) { throw 'Smoke test failed' }
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' packaging/windows/Fuorigiri.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - run: python scripts/release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Fuorigiri-windows-candidate
          path: dist/release/
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python3 scripts/verify_suite_ui.py
      - run: npm ci && npm run build
        working-directory: frontend
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          python3 scripts/prepare_flatpak.py
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build packaging/linux/org.fuorigiri.PerformanceLab.json
          flatpak-builder --run flatpak-build packaging/linux/org.fuorigiri.PerformanceLab.json fuorigiri --smoke-test --data /tmp/fuorigiri-ci-smoke
          mkdir -p dist/release
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          flatpak build-bundle flatpak-repo "dist/release/Fuorigiri-${VERSION}-linux-x86_64.flatpak" org.fuorigiri.PerformanceLab --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Fuorigiri-linux-candidate
          path: |
            dist/release/*.flatpak
            wheelhouse/requirements-resolved.txt
            wheelhouse/SHA256.json
