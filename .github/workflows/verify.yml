name: Verify
# RT-06: lightweight checks without packaging, on every push to main, on pull
# requests and on demand (activation decided on 15 November 2026). Packaging
# workflows (desktop-build, android-build) stay manual.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Windows matches the pinned lockfile and the platform the tests are tuned on.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock-windows.hashes
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # RT-19: PyPI pins with hashes, then the vendored common wheel (digest checked by verify_core.py).
      - run: python -m pip install --require-hashes -r requirements-lock-windows.hashes
      - run: python -m pip install --no-deps --no-index -r requirements-common.txt
      - run: npm ci
        working-directory: frontend
      - run: python scripts/verify.py
  android-versions:
    # RT-16: Python tests with the library versions shipped on Android. Python
    # 3.12 because numpy 1.26.2 and matplotlib 3.8.4 have no 3.13 wheels on PyPI.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/test_android_versions.py --venv .local/android-versions-ci
