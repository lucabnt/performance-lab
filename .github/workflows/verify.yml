name: Verify
# RT-06: lightweight checks without packaging. Manual only for now: whether to
# also run on push and pull_request before the repository becomes public is an
# open decision (docs/REVISIONE_TECNICA.md, "Punti aperti").
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Windows matches the pinned lockfile and the platform the tests are tuned on.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock-windows.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-lock-windows.txt
      - run: npm ci
        working-directory: frontend
      - run: python scripts/verify.py
