[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fuorigiri"
version = "0.10.0"
description = "Archivio e analisi offline dei test incrementali nel ciclismo"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["cycling-suite-core==0.1.2", "fastapi", "uvicorn", "python-multipart>=0.0.32", "fitdecode", "numpy", "matplotlib", "reportlab", "cryptography"]

[project.optional-dependencies]
desktop = ["PySide6", "keyring==25.7.0"]
dev = ["pytest", "httpx", "pyinstaller", "pypdf>=6.21.4", "ruff==0.17.5"]

[project.scripts]
fuorigiri-performance-lab = "cycling_test.desktop:main"
fuorigiri = "cycling_test.desktop:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
src = ["backend", "tests", "scripts"]
extend-exclude = ["android", "frontend", "packaging", "vendor", ".local", "tmp", "output", "dist", "build", "wheelhouse"]

line-length = 120

[tool.ruff.format]
# RT-05: readable layout without rewriting every string literal.
quote-style = "preserve"

[tool.ruff.lint]
# Errors only (pyflakes and syntax); style rules wait for the formatting step (RT-05).
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Product adapter: re-exports the shared transport helpers used by cloud/sync modules.
"backend/cycling_test/transports.py" = ["F401"]
# Smoke test imports modules only to prove the bundle contains them; the Qt app must stay referenced.
"backend/cycling_test/desktop.py" = ["F401", "F841"]
